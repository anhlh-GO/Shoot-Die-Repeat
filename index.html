<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shoot Die Repeat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --gold:#ffd23f; --ink:#1d2330; --panel:#2a3140; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:#9fc9e8; font-family:'Fredoka',system-ui,sans-serif; color:#fff; touch-action:none; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .layer { position:fixed; inset:0; pointer-events:none; }
  .layer > * { pointer-events:auto; }
  .hidden { display:none !important; }
  .stroke { text-shadow: 0 2px 0 #1d2330, 2px 0 0 #1d2330, -2px 0 0 #1d2330, 0 -2px 0 #1d2330, 2px 2px 0 #1d2330, -2px 2px 0 #1d2330, 2px -2px 0 #1d2330, -2px -2px 0 #1d2330; }

  /* loading */
  #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:linear-gradient(#8ec5ea,#cfe8f7); z-index:50; }
  #loading h1 { margin:0; font-size:44px; letter-spacing:1px; }
  #loadbar { width:min(320px,70vw); height:18px; border-radius:10px; background:#1d2330; padding:3px; }
  #loadfill { height:100%; width:0; border-radius:8px; background:var(--gold); transition:width .2s; }

  /* top bar */
  #topbar { position:absolute; top:max(10px,env(safe-area-inset-top)); left:12px; right:12px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  .pill { display:flex; align-items:center; gap:6px; background:rgba(29,35,48,.78); border-radius:999px; padding:4px 14px 4px 4px; font-weight:700; font-size:20px; pointer-events:auto; }
  .pill img { width:30px; height:30px; }
  .iconbtn { width:44px; height:44px; border:none; background:center/contain no-repeat; cursor:pointer; pointer-events:auto; }

  /* HUD */
  #hud { position:absolute; top:calc(max(10px,env(safe-area-inset-top)) + 52px); left:50%; transform:translateX(-50%); width:min(460px,86vw); pointer-events:none; }
  #prog { position:relative; height:22px; border-radius:12px; background:rgba(29,35,48,.8); padding:3px; }
  #progfill { height:100%; width:0; border-radius:10px; background:linear-gradient(#ffe36e,#f5b60f); }
  #progbest { position:absolute; top:-4px; width:4px; height:30px; background:#fff; border-radius:2px; box-shadow:0 0 0 2px #1d2330; }
  #progtext { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
  #progflag { position:absolute; right:-14px; top:-10px; font-size:26px; }
  #hudrow { display:flex; justify-content:space-between; margin-top:8px; font-weight:700; font-size:18px; }
  #hudrow span { display:flex; align-items:center; gap:4px; }
  #hudrow img { width:24px; height:24px; }
  #hint { position:absolute; left:50%; bottom:16%; transform:translateX(-50%); width:92%; text-align:center; font-size:clamp(16px,4.6vw,24px); font-weight:700; pointer-events:none; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.45; } }
  #reloadbar { width:70px; height:7px; border-radius:4px; background:rgba(29,35,48,.85); overflow:hidden; margin-left:4px; }
  #reloadbar i { display:block; height:100%; width:0; background:#5fd0ff; }
  #vignette { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .15s; background:radial-gradient(ellipse at center, transparent 45%, rgba(220,30,40,.65) 100%); }
  #hitflash { position:fixed; inset:0; pointer-events:none; opacity:0; background:#fff; }
  #cross { position:fixed; width:34px; height:34px; margin:-17px 0 0 -17px; pointer-events:none; border:3px solid #fff; border-radius:50%; box-shadow:0 0 0 2px rgba(29,35,48,.7), inset 0 0 0 2px rgba(29,35,48,.7); }
  #cross::after { content:''; position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:#ff4d5a; }
  #cross.fire { transform:scale(.8); }
  #banner { position:fixed; left:50%; top:30%; transform:translate(-50%,-50%); font-weight:700; font-size:clamp(34px,9vw,64px); white-space:nowrap; pointer-events:none; opacity:0; color:#ffd23f; }
  #banner.show { animation:bannerpop 1.1s ease-out forwards; }
  @keyframes bannerpop { 0% { opacity:0; transform:translate(-50%,-50%) scale(2.2); } 15% { opacity:1; transform:translate(-50%,-50%) scale(.95); } 25% { transform:translate(-50%,-50%) scale(1.05); } 75% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-70%) scale(1); } }
  #btn-pause { position:absolute; top:calc(max(10px,env(safe-area-inset-top)) + 52px); right:12px; width:44px; height:44px; border:none; border-radius:12px; background:rgba(29,35,48,.78); color:#fff; font:700 20px 'Fredoka'; cursor:pointer; pointer-events:auto; }
  .ft.dmg { font-size:18px; }

  /* panels */
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:16px 16px max(20px,env(safe-area-inset-bottom)); background:linear-gradient(transparent 35%, rgba(20,24,34,.55)); }
  .screen.center { justify-content:center; background:rgba(20,24,34,.55); }
  .era { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .era img { width:64px; height:64px; border-radius:50%; }
  .era .t1 { font-size:16px; font-weight:600; opacity:.9; }
  .era .t2 { font-size:30px; font-weight:700; line-height:1; }
  .cards { display:flex; gap:10px; width:min(560px,100%); }
  .card { flex:1; min-width:0; border-radius:18px; padding:10px 8px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; background:#2b3242; border:4px solid #1d2330; box-shadow:0 5px 0 #141821; }
  .card img.ic { width:46px; height:46px; }
  .card .nm { font-size:15px; font-weight:700; letter-spacing:.5px; }
  .card .lv { font-size:13px; opacity:.75; }
  .card .val { font-size:17px; font-weight:700; color:#8ef08a; }
  .pips { display:flex; gap:3px; }
  .pips i { width:9px; height:9px; border-radius:3px; background:#4a5366; }
  .pips i.on { background:var(--gold); }
  .buy { width:100%; border:none; border-radius:12px; padding:7px 4px; font:700 18px 'Fredoka'; color:#fff; display:flex; align-items:center; justify-content:center; gap:4px; cursor:pointer; background:#3bb54a; box-shadow:0 4px 0 #23802f; }
  .buy img { width:20px; height:20px; }
  .buy:disabled { background:#5b6375; box-shadow:0 4px 0 #3c4250; color:#c9cdd6; cursor:default; }
  .buy:not(:disabled):active { transform:translateY(3px); box-shadow:0 1px 0 #23802f; }
  .bigbtn { margin-top:14px; width:min(360px,90%); border:none; cursor:pointer; font:700 34px 'Fredoka'; color:#fff; padding:12px 0 16px; border-radius:20px; background:center/100% 100% no-repeat; letter-spacing:1px; }
  .bigbtn:active { transform:scale(.97); }
  .subtitle { font-size:15px; opacity:.85; margin-top:8px; text-align:center; }

  .result { width:min(400px,92%); border-radius:24px; background:#2b3242; border:5px solid #1d2330; box-shadow:0 7px 0 #141821; padding:20px 18px; display:flex; flex-direction:column; align-items:center; gap:10px; position:relative; }
  .result h2 { margin:0; font-size:34px; }
  .result .big { font-size:52px; font-weight:700; line-height:1; color:var(--gold); }
  .result .newbest { background:#e8455a; padding:2px 12px; border-radius:999px; font-weight:700; font-size:16px; transform:rotate(-4deg); }
  .stats { display:flex; gap:20px; font-size:20px; font-weight:700; }
  .stats span { display:flex; align-items:center; gap:6px; }
  .stats img { width:28px; height:28px; }
  .coinrow { display:flex; align-items:center; gap:8px; font-size:34px; font-weight:700; }
  .coinrow img { width:40px; height:40px; }
  .ribbon { width:min(380px,92%); margin-bottom:-26px; z-index:2; position:relative; }
  .rays { position:absolute; width:640px; height:640px; left:50%; top:42%; transform:translate(-50%,-50%); opacity:.35; animation:spin 14s linear infinite; pointer-events:none; background:center/contain no-repeat; }
  @keyframes spin { to { transform:translate(-50%,-50%) rotate(360deg); } }
  .smallbtn { border:none; cursor:pointer; font:700 22px 'Fredoka'; color:#fff; padding:10px 26px; border-radius:16px; background:#3d8be0; box-shadow:0 5px 0 #255fa0; }
  .smallbtn.green { background:#3bb54a; box-shadow:0 5px 0 #23802f; }
  .smallbtn:active { transform:translateY(3px); }

  #floaters { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .ft { position:absolute; transform:translate(-50%,-50%); font-weight:700; white-space:nowrap; pointer-events:none; }

  #settings .result { gap:14px; }
  .toggles { display:flex; gap:18px; }
  .toggles button { width:70px; height:70px; border:none; background:center/contain no-repeat; cursor:pointer; }
  .lvlgrid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; width:100%; }
  .lvlgrid button { border:none; border-radius:10px; padding:6px 0; font:700 16px 'Fredoka'; color:#fff; background:#4a5366; cursor:pointer; }
  .lvlgrid button.cur { background:#f5b60f; color:#1d2330; }
  .credit { font-size:12px; opacity:.6; text-align:center; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vignette"></div><div id="hitflash"></div>
<div id="floaters"></div>
<div id="cross" class="hidden"></div><div id="banner" class="stroke"></div>

<div id="loading"><h1 class="stroke">SHOOT DIE REPEAT</h1><div id="loadbar"><div id="loadfill"></div></div><div id="loadtxt">Loading…</div></div>

<div class="layer" id="ui">
  <div id="topbar">
    <div class="pill"><img id="ic-coin" alt=""><span id="coins">0</span></div>
    <button class="iconbtn" id="btn-settings" aria-label="Settings"></button>
  </div>

  <div id="hud" class="hidden">
    <div id="prog"><div id="progfill"></div><div id="progbest"></div><div id="progtext" class="stroke">0 m</div><div id="progflag">🚩</div></div>
    <div id="hudrow" class="stroke">
      <span><img id="ic-skull" alt=""><b id="kills">0</b></span>
      <span><img id="ic-bullet" alt=""><b id="ammo">∞</b><span id="reloadbar"><i id="reloadfill"></i></span></span>
    </div>
  </div>
  <button id="btn-pause" class="hidden" aria-label="Pause">II</button>
  <div id="hint" class="stroke hidden">Kéo / di chuột để ngắm · Giữ để bắn</div>

  <div id="prerun" class="screen hidden">
    <div class="era"><img id="era-icon" alt=""><div><div class="t1 stroke" id="era-level">LEVEL 1</div><div class="t2 stroke" id="era-name">STONE AGE</div></div></div>
    <div class="cards" id="cards"></div>
    <button class="bigbtn stroke" id="btn-fight">FIGHT</button>
    <div class="subtitle stroke" id="prerun-sub"></div>
  </div>

  <div id="result" class="screen center hidden">
    <div class="result">
      <h2 class="stroke" id="res-title">YOU DIED</h2>
      <div class="big stroke" id="res-dist">0 m</div>
      <div class="newbest hidden" id="res-best">NEW BEST!</div>
      <div class="stats stroke"><span><img id="ic-skull2" alt=""><b id="res-kills">0</b></span><span>🎯 <b id="res-head">0</b></span></div>
      <div class="coinrow stroke"><img id="ic-coin2" alt=""><span id="res-coins">+0</span></div>
      <div style="display:flex;gap:10px"><button class="smallbtn" id="btn-double">x2 COINS</button><button class="smallbtn green" id="btn-continue">CONTINUE</button></div>
    </div>
  </div>

  <div id="victory" class="screen center hidden">
    <div class="rays" id="rays"></div>
    <img class="ribbon" id="ribbon" alt="Victory">
    <div class="result">
      <div style="height:18px"></div>
      <div class="t1 stroke" id="vic-era">STONE AGE CLEARED</div>
      <div class="stats stroke"><span><img id="ic-skull3" alt=""><b id="vic-kills">0</b></span><span>🎯 <b id="vic-head">0</b></span></div>
      <div class="coinrow stroke"><img id="ic-coin3" alt=""><span id="vic-coins">+0</span></div>
      <button class="smallbtn green" id="btn-next">NEXT ERA ▶</button>
    </div>
  </div>

  <div id="settings" class="screen center hidden">
    <div class="result">
      <h2 class="stroke">SETTINGS</h2>
      <div class="toggles"><button id="tg-sound" aria-label="Sound"></button><button id="tg-music" aria-label="Music"></button></div>
      <div class="t1 stroke">Chọn level (cheat build)</div>
      <div class="lvlgrid" id="lvlgrid"></div>
      <button class="smallbtn" id="btn-addcoins">+1000 coins</button>
      <button class="smallbtn green" id="btn-close-settings">ĐÓNG</button>
      <div class="credit">Art, models, audio &amp; level layouts extracted from shoot_die_repeat 1.3.0</div>
    </div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="assets.js"></script>
<script src="game.js"></script>
</body>
</html>
